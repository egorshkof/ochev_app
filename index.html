<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 500px;
            margin: auto;
            padding: 25px 20px;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
        }

        .balance {
            background: #1d1d1d;
            border-radius: 18px;
            padding: 20px;
            margin-top: 25px;
        }

        .balance-title {
            color: #888;
            font-size: 15px;
        }

        #balance {
            margin-top: 8px;
            font-size: 36px;
            font-weight: bold;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 50px 0 30px;
        }

        .dice {
            width: 110px;
            height: 110px;
            background: white;
            color: black;
            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 65px;
        }

        #result {
            min-height: 30px;
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 18px;

            border: 0;
            border-radius: 16px;

            background: #2481cc;
            color: white;

            font-size: 20px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎲 Кубики</h1>

    <div class="balance">
        <div class="balance-title">
            Ваш баланс
        </div>

        <div id="balance">
            ...
        </div>
    </div>

    <div class="dice-container">
        <div class="dice" id="dice1">⚀</div>
        <div class="dice" id="dice2">⚀</div>
    </div>

    <div id="result">
        Бросьте два кубика
    </div>

    <button id="roll">
        🎲 Бросить
    </button>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const balanceElement = document.getElementById("balance");
    const dice1Element = document.getElementById("dice1");
    const dice2Element = document.getElementById("dice2");
    const resultElement = document.getElementById("result");
    const rollButton = document.getElementById("roll");

    const diceSymbols = [
        "",
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    const API_URL = "https://YOUR-SERVER-DOMAIN.com";

    async function loadBalance() {
        try {
            const response = await fetch(
                API_URL + "/balance",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: tg.initData
                    })
                }
            );

            const data = await response.json();

            balanceElement.textContent = data.balance;
        } catch (error) {
            balanceElement.textContent = "Ошибка";
        }
    }

    async function rollDice() {
        rollButton.disabled = true;
        resultElement.textContent = "Бросаем...";

        try {
            const response = await fetch(
                API_URL + "/roll",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: tg.initData
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail);
            }

            dice1Element.textContent = diceSymbols[data.dice1];
            dice2Element.textContent = diceSymbols[data.dice2];

            resultElement.textContent =
                `${data.dice1} + ${data.dice2} = ${data.sum} очков`;

            balanceElement.textContent = data.balance;

        } catch (error) {
            resultElement.textContent = "Ошибка при броске";
        }

        rollButton.disabled = false;
    }

    rollButton.addEventListener("click", rollDice);

    loadBalance();
</script>

</body>
</html>
