<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод данных</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 20px;
            font-family: sans-serif;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Введите ваши данные:</h2>
    
    <!-- Поле для ввода текста -->
    <input type="text" id="userInput" placeholder="Напишите что-нибудь...">
    
    <button id="sendBtn">Отправить боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('sendBtn').addEventListener('click', () => {
            // Получаем текст из поля ввода
            const textValue = document.getElementById('userInput').value;
            
            // Если поле не пустое, отправляем данные в бота
            if (textValue.trim() !== "") {
                tg.sendData(textValue); 
            } else {
                tg.showAlert("Пожалуйста, введите текст!");
            }
        });
    </script>
</body>
</html>
